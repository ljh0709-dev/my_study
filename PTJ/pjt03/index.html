<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSAFY인의 포트폴리오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <!-- style: style.css에 CSS 작성 -->
  <link rel="stylesheet" href="./style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <!-- 한 줄을 차지 : block 요소 = div -->
  <!-- 필요한 만큼만 차지 : inline 요소 = img, a, span -->
  <!-- 시멘틱 태그(의미가 있는 태그) 적절히 활용 -->

  <!-- header: 제목이나 로고 등의 정보 포함 -->
  <header class="header">
    <!-- nav: 페이지 메뉴를 만들 때 사용 -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#frontpage">Frontpage</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#my-intro">Intro</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#skills">Skills</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#projects">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">Contact</a>
            </li>
          </ul>
          </li>
          </ul>
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
            <button class="btn btn-outline-success" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>

  </header>

  <!-- main: 주요 콘텐츠 -->
  <main id="frontpage" class="frontpage">
    메인 콘텐츠
    <p class="intro-text">안녕하세요. 개발자입니다.</p>
  </main>

  <!-- section: 주제 별로 문서의 콘텐츠 영역을 구성 -->
  <section id="my-intro" class="my-intro">자기소개
    <button class="intro-button">클릭하세요</button>
  </section>
  <section id="skills" class="skills">나의 기술 스택 소개</section>
  <section id="projects" class="projects">진행한 프로젝트</section>
  <section id="contact" class="contact">연락처 남기기</section>

  <br><br><br><br><br>
  <br><br><br><br><br>
  <br><br><br><br><br>
  <!-- footer: 문서의 꼬리말, 저작권 정보, 연락처 등 포함 -->
  <footer class="footer">꼬리말</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
