<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <!-- style: style.css에 CSS 작성 -->
  <link rel="stylesheet" href="./portstyle.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>포트폴리오</title>
</head>

<body>
  <!-- 상단 프로필 헤더 -->
  <div class="profile-header">
    John Doe님의 프로필 페이지
  </div>

  <!-- Navigation Bar -->
  <div class="nav-fixed">
    <div class="nav-container">
      <div class="nav-tabs">
        <a href="info.html">기본 정보 수정</a>
        <a href="port.html">포트폴리오 수정</a>
      </div>
      <div class="nav-divider"></div>
    </div>
  </div>

  <div class="container">
    <h2 class="title mt-5">포트폴리오 수정</h2>
    <form>
      <div class="form-group">
        <label>회원 번호</label>
        <input type="text" class="form-control-disabled" value="1" disabled>
      </div>

      <div class="form-group">
        <label>ID</label>
        <input type="text" class="form-control-disabled" value="김싸피" disabled>
      </div>

      <div class="section">
        <h3 class="section-title">저축 성향</h3>

        <div class="options">
          <label><input type="radio" name="style"> 도전형</label>
          <label><input type="radio" name="style"> 검소형</label>
          <label><input type="radio" name="style"> 알뜰형</label>
        </div>
      </div>

      <div class="section">
        <h3 class="section-title">포트폴리오 비율</h3>
        <div class="portfolio-grid">
          <div>
            <label>주식</label>
            <input type="number" class="form-control">
          </div>
          <div>
            <label>채권</label>
            <input type="number" class="form-control">
          </div>
          <div>
            <label>부동산</label>
            <input type="number" class="form-control">
          </div>
          <div>
            <label>현금</label>
            <input type="number" class="form-control">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>최애은행</label>
        <div class="input-group">
          <input type="number" placeholder="가장 좋아하는 은행을 입력해주세요">
          <button type="button" class="btn-update">Update</button>
        </div>
      </div>
    </form>
    <div class="portfolio-summary m-3">
      <h4>내 포트폴리오 요약</h4>
      <p>주식 : 40%</p>
      <p>채권 : 20%</p>
      <p>부동산 : 30%</p>
      <p>현금 : 10%</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
